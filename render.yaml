# ─── BLUEPRINT DE RENDER ─────────────────────────────────────────────────────
# Dos servicios desde frontend/: la API (Express, Frankfurt) y el sitio
# estático (CDN de Render). El navegador solo ve el dominio del sitio: /api/*
# y /tarjeta se reenvían a la API con reglas de rewrite.
#
# Si Render asigna a la API una URL distinta de https://camybgs-api.onrender.com
# (nombre ya ocupado), cambiarla en las dos reglas de rewrite de abajo.
#
# Vercel sigue funcionando en paralelo con api/ y vercel.json.

services:
  # ── API: formulario de contacto, doble opt-in y /tarjeta ───────────────────
  - type: web
    name: camybgs-api
    runtime: node
    region: frankfurt
    plan: starter
    branch: rediseno-2026
    rootDir: frontend
    buildCommand: npm ci
    startCommand: npm run start:api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGO_URI
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: SYSTEME_API_KEY
        sync: false
      - key: CONSENT_SECRET
        sync: false
      - key: SITE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

  # ── Sitio estático: la SPA de React/Vite ───────────────────────────────────
  - type: web
    name: camybgs-web
    runtime: static
    branch: rediseno-2026
    rootDir: frontend
    buildCommand: npm ci && npm run build:render
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    headers:
      # Archivos de Vite con hash en el nombre: no cambian nunca
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    # Se aplican en orden y solo si no existe un archivo con esa ruta
    routes:
      # Direcciones antiguas (también en vercel.json y en App.jsx)
      - type: redirect
        source: /resultados
        destination: /proyectos
      - type: redirect
        source: /mi-trabajo
        destination: /proyectos
      - type: redirect
        source: /datenschutz
        destination: /privacidad
      # API y QR de las tarjetas (302 desde la API)
      - type: rewrite
        source: /tarjeta
        destination: https://camybgs-api.onrender.com/tarjeta
      - type: rewrite
        source: /api/*
        destination: https://camybgs-api.onrender.com/api/*
      # Páginas prerenderizadas (scripts/prerender.js): cada una con su HTML.
      # Las mismas del sitemap; si se activa Bond (SHOW_BOND), añadir /bond y
      # /en/bond.
      - type: rewrite
        source: /servicios
        destination: /servicios/index.html
      - type: rewrite
        source: /proyectos
        destination: /proyectos/index.html
      - type: rewrite
        source: /sobre-mi
        destination: /sobre-mi/index.html
      - type: rewrite
        source: /contacto
        destination: /contacto/index.html
      - type: rewrite
        source: /impressum
        destination: /impressum/index.html
      - type: rewrite
        source: /privacidad
        destination: /privacidad/index.html
      - type: rewrite
        source: /en
        destination: /en/index.html
      - type: rewrite
        source: /en/services
        destination: /en/services/index.html
      - type: rewrite
        source: /en/projects
        destination: /en/projects/index.html
      - type: rewrite
        source: /en/about
        destination: /en/about/index.html
      - type: rewrite
        source: /en/contact
        destination: /en/contact/index.html
      - type: rewrite
        source: /en/impressum
        destination: /en/impressum/index.html
      - type: rewrite
        source: /en/privacy
        destination: /en/privacy/index.html
      # SPA: el resto de rutas las resuelve React Router
      - type: rewrite
        source: /*
        destination: /index.html
